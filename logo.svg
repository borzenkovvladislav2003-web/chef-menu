<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .bg { fill: #1E3A2F; }
      .cream-primary { fill: #F7F5EE; }
      .cream-soft { fill: #D6D0C2; }
      .stroke-cream { stroke: #F7F5EE; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.22em; fill: #F7F5EE; text-anchor: middle; }
      .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.38em; fill: #A3B5A9; text-anchor: middle; }
    </style>
  </defs>

  <!-- Deep Olive-Emerald Background -->
  <rect width="600" height="600" class="bg" rx="32"/>

  <!-- Outer Double Circle Seal -->
  <circle cx="300" cy="240" r="140" fill="none" stroke="#F7F5EE" stroke-width="1.8" opacity="0.3"/>
  <circle cx="300" cy="240" r="130" fill="none" stroke="#F7F5EE" stroke-width="2.5" opacity="0.8"/>

  <!-- Central Crest: Cloche & Chef Toque -->
  <g transform="translate(300, 240)">
    <!-- Cloche Dome -->
    <path d="M -60,30 C -60,-35 60,-35 60,30 Z" class="cream-primary"/>
    <!-- Cloche Handle -->
    <circle cx="0" cy="-42" r="7" class="cream-primary"/>
    <rect x="-3" y="-36" width="6" height="5" class="cream-primary"/>
    
    <!-- Cloche Plate Rim -->
    <rect x="-75" y="34" width="150" height="6" rx="3" class="cream-primary"/>

    <!-- Negative Space Cutout inside Cloche: Chef Toque Hat -->
    <path d="M -16,18 C -24,18 -26,10 -22,2 C -28,-4 -24,-14 -16,-13 C -16,-20 -8,-24 -3,-20 C 2,-24 10,-20 10,-13 C 18,-14 22,-4 16,2 C 20,10 18,18 10,18 Z" fill="#1E3A2F"/>
    <rect x="-10" y="20" width="20" height="4" rx="2" fill="#1E3A2F"/>

    <!-- Two small decorative stars flanking the crest -->
    <path d="M -85,-10 L -83,-5 L -78,-5 L -82,-2 L -80,3 L -85,0 L -90,3 L -88,-2 L -92,-5 L -87,-5 Z" class="cream-soft" transform="scale(1.2) translate(-15, 0)"/>
    <path d="M 85,-10 L 87,-5 L 92,-5 L 88,-2 L 90,3 L 85,0 L 80,3 L 82,-2 L 78,-5 L 83,-5 Z" class="cream-soft" transform="scale(1.2) translate(15, 0)"/>
  </g>

  <!-- Typography with Warm Editorial Feeling -->
  <text x="300" y="445" class="title">CHEF VLADISLAV</text>
  
  <line x1="210" y1="465" x2="390" y2="465" stroke="#A3B5A9" stroke-width="1.2" opacity="0.4"/>
  
  <text x="305" y="495" class="subtitle">PERSONAL COOK</text>
</svg>