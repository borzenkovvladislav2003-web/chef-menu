<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .bg { fill: #FAF8F5; }
      .stroke-primary { stroke: #1E3A2F; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-accent { stroke: #3D5E48; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .fill-accent { fill: #3D5E48; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 42px; font-weight: 600; font-style: italic; letter-spacing: 0.08em; fill: #1E3A2F; text-anchor: middle; }
      .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.26em; fill: #6B8775; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" class="bg" rx="32"/>

  <!-- Delicate Monoline Graphic (Whisk & Botanical Swirl) -->
  <g transform="translate(300, 220)">
    <!-- Ambient Swirling Flourish Trail -->
    <path d="M -90,-20 C -120,40 -40,110 30,105 C 100,100 120,30 85,-40 C 60,-90 -10,-105 -50,-80" class="stroke-accent" stroke-width="2.5" stroke-dasharray="140 12" opacity="0.6"/>

    <!-- Botanical Olive Leaves on the Swirl -->
    <g transform="translate(-85, -20) rotate(-40)">
      <path d="M 0,0 Q 15,-15 30,-5 Q 15,10 0,0 Z" class="fill-accent"/>
      <path d="M 12,-18 Q 28,-30 40,-18 Q 25,-8 12,-18 Z" class="fill-accent" opacity="0.8"/>
      <path d="M 26,-36 Q 40,-45 50,-32 Q 36,-24 26,-36 Z" class="fill-accent" opacity="0.6"/>
    </g>

    <!-- The Artisan Whisk (Centered & Angled) -->
    <g transform="rotate(18) translate(0, -30)">
      <!-- Whisk Handle -->
      <path d="M -6,-120 L 6,-120 L 8,-35 L -8,-35 Z" fill="#1E3A2F"/>
      <!-- Whisk Hanging Loop / Cap -->
      <path d="M -4,-120 C -4,-130 4,-130 4,-120 Z" class="stroke-primary" stroke-width="2.5"/>
      <line x1="-8" y1="-35" x2="8" y2="-35" class="stroke-primary" stroke-width="3"/>
      
      <!-- Whisk Outer Loops (Steel Wires) -->
      <path d="M -7,-35 C -35,15 -32,75 0,95 C 32,75 35,15 7,-35" class="stroke-primary" stroke-width="3.5"/>
      <path d="M -5,-35 C -24,15 -20,68 0,85 C 20,68 24,15 5,-35" class="stroke-accent" stroke-width="2.8"/>
      <path d="M -3,-35 C -12,15 -10,60 0,72 C 10,60 12,15 3,-35" class="stroke-accent" stroke-width="2.2"/>
      <line x1="0" y1="-35" x2="0" y2="70" class="stroke-accent" stroke-width="2"/>
    </g>
  </g>

  <!-- Clean Separation Line -->
  <line x1="210" y1="385" x2="390" y2="385" stroke="#3D5E48" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>

  <!-- Warm Lettering -->
  <text x="300" y="440" class="title">Chef Vladislav</text>
  <text x="302" y="478" class="subtitle">HOME DINING &amp; PASTRY • NHA TRANG</text>
</svg>